# spine1, the route reflector, captured with `show running-config` on
# 2026-10-15, FRR 8.5.3, in the layout the post ends on.
# This is what the box reports back, not a typed sequence.
#
# The `nooverlay` peer group is this cluster's. Nodes join it dynamically
# through a listen range. 192.168.20.48/29 is the primary-NIC layout;
# 192.168.30.48/28 is left over from the first build. `route-reflector-client`
# under `ipv4 unicast` is what passes each node's pod /24 to the other nodes.
# `nooverlay` is not activated under l2vpn evpn: this cluster has no EVPN.
#
# FABRIC and `ocp` belong to the earlier posts' fabric and EVPN cluster. They
# are in the capture because they are on the box.

Current configuration:
!
frr version 8.5.3
frr defaults traditional
hostname spine1
no ipv6 forwarding
!
router bgp 65000
 bgp router-id 192.168.30.2
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as 65000
 neighbor nooverlay peer-group
 neighbor nooverlay remote-as 65000
 neighbor ocp peer-group
 neighbor ocp remote-as 65000
 neighbor 192.168.30.11 peer-group FABRIC
 neighbor 192.168.30.12 peer-group FABRIC
 bgp listen range 192.168.30.48/28 peer-group nooverlay
 bgp listen range 192.168.20.48/29 peer-group nooverlay
 bgp listen range 192.168.30.16/28 peer-group ocp
 !
 address-family ipv4 unicast
  neighbor FABRIC route-reflector-client
  neighbor nooverlay route-reflector-client
  neighbor ocp route-reflector-client
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC route-reflector-client
  neighbor ocp activate
  neighbor ocp route-reflector-client
 exit-address-family
exit
!
