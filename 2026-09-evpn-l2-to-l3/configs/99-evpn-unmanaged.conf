# /etc/NetworkManager/conf.d/99-evpn-unmanaged.conf
#
# Extended from the L2 version, which listed ens19 only. tenant-a, vxlan101
# and br101 are devices NetworkManager has never seen -- and NM silently
# pulling ens19 back out of br100 is what cost ~30 minutes on 2026-08-27.
#
# Apply on both leaves, then: systemctl reload NetworkManager
[keyfile]
unmanaged-devices=interface-name:ens19;interface-name:vxlan101;interface-name:br101;interface-name:tenant-a
