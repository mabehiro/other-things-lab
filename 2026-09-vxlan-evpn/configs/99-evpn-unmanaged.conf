# /etc/NetworkManager/conf.d/99-evpn-unmanaged.conf
#
# Without this, NetworkManager reclaims the host-facing NIC and pulls it back
# out of br100, leaving it disconnected. EVPN stays perfectly healthy while
# the dataplane is broken -- the remote MAC is still present via BGP, the ping
# just stops.
#
# `nmcli device set ens19 managed no` is runtime only and does NOT survive a
# reboot. On 2026-08-27 one leaf was accidentally healthy for exactly that
# reason and would have failed on its next boot with no change made by anyone.
#
# Apply on both leaves, then: systemctl reload NetworkManager
# Verify: nmcli device status | grep ens19   -> must read "unmanaged"
[keyfile]
unmanaged-devices=interface-name:ens19
